# 開発ブランチへのpushでlint・型チェック・テスト・ビルドを実行する。
# mainへのpushはdeploy.ymlが同じチェックをデプロイ前に実行するため対象外。
# lintは警告でも失敗させ(--error-on-warnings)、PRのステータスチェックで気づけるようにする。
#
# actionsはタグではなくコミットハッシュで固定する(サプライチェーン対策)。
# 更新手順はdeploy.yml冒頭のコメント参照。
name: CI

on:
  push:
    branches-ignore: [main]

# 同じブランチへ連続pushしたとき、古いrunをキャンセルして最新だけ走らせる
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node.jsの版をdocker-compose.ymlの1か所で管理し、開発環境と同じイメージで検証・ビルドする
      - run: docker compose run --rm app npm ci
      - run: docker compose run --rm app npm run lint:ci
      - run: docker compose run --rm app npm run typecheck
      - run: docker compose run --rm app npm test
      - run: docker compose run --rm app npm run build
