# mainへのpushでlint→型チェック→テスト→ビルド→GitHub Pagesへデプロイする。
# 初回のみ: リポジトリ設定 → Pages → Source を「GitHub Actions」にすること。
#
# actionsはタグ(@vN)ではなくコミットハッシュで固定する(サプライチェーン対策)。
# タグは後から別コミットへ付け替えられるため、タグ指定では改ざんされたコードが
# 実行され得る。ハッシュなら内容が一意に決まる。更新時は新しいタグのハッシュを
# `gh api repos/actions/<name>/tags` で確認して、ハッシュとコメントの両方を書き換えること。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CIと同じく警告でも失敗させる
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
