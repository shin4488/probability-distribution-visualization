# mainへのマージごとに本番へデプロイされるため、更新PRは週1回・エコシステムごとに1つにまとめ、公開から7日未満の版は見送る。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node.js 25はLTSにならない最後の奇数版。27以降は全メジャーがLTSになるため、除外が要るのは25だけ
    ignore:
      - dependency-name: node
        versions: [">= 25, < 26"]
    groups:
      docker-compose:
        patterns: ["*"]
